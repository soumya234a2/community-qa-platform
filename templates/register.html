{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Create your account</h1>
{% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="form narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" required minlength="3" maxlength="30" autocomplete="username" value="{{ form.username }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" value="{{ form.email }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <p class="hint">At least 8 characters.</p>
  <button class="btn">Sign up</button>
  <p class="hint">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</form>
{% endblock %}
